<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Favorit — ColorOfDay</title>
    <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#111827] font-sans text-slate-100">
    <header class="sticky top-0 z-50 border-b border-slate-800 bg-[#111827]/90 backdrop-blur-md">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
            <a href="./index.html" class="text-xl font-bold text-cyan-400 md:text-2xl">Color<span class="text-white">OfDay</span></a>
            <nav class="flex items-center gap-2 text-xs md:gap-6 md:text-base">
                <a href="./index.html" class="font-medium transition hover:text-cyan-400">Beranda</a>
                <a href="./index.html#cerita" class="hidden font-medium transition hover:text-cyan-400 md:inline">Rekomendasi</a>
                <a href="./palette-studio.html" class="font-medium transition hover:text-cyan-400"><span class="sm:hidden">Studio</span><span class="hidden sm:inline">Studio Warna</span></a>
                <a href="./favorites.html" aria-current="page" class="font-semibold text-cyan-300">Favorit <span data-favorite-count class="text-cyan-400"></span></a>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-14 md:py-20">
        <div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
            <div>
                <span class="text-xs font-bold uppercase tracking-[0.2em] text-rose-300">Your Style Collection</span>
                <h1 class="mt-3 text-4xl font-extrabold text-white md:text-5xl">Koleksi Favorit <span class="text-rose-400">♡</span></h1>
                <p class="mt-3 text-slate-400">Semua inspirasi outfit dan palet warna yang kamu simpan ada di sini.</p>
            </div>
            <button id="clearFavorites" type="button" class="hidden rounded-xl border border-rose-700 px-5 py-3 font-semibold text-rose-300 transition hover:bg-rose-950/60">Hapus semua</button>
        </div>

        <p id="favoritesMessage" role="status" class="mt-6 text-sm text-slate-400"></p>
        <div id="favoritesGrid" class="mt-6 grid gap-5 md:grid-cols-2 xl:grid-cols-3"></div>
    </main>

    <footer class="border-t border-slate-800 bg-[#0B0F17] px-6 py-8 text-center">
        <p class="font-bold text-cyan-400">ColorOfDay</p>
        <p class="mt-2 text-sm text-slate-500">Your Mood. Your Color. Your Day.</p>
    </footer>
    <script src="./src/js/features.js"></script>
</body>
</html>
